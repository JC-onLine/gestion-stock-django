<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
    <h1>{{ title }}</h1>
    <h2>{{ subtitle }}</h2>
    <ul>
        {% for provider in providers %}
            <li>
                <a href="{% url 'open_stock:provider_detail' provider.pk %}">{{ provider.name }}</a>
            </li>
        {% endfor %}
    </ul>
<a href="{% url 'open_stock:provider_create' %}">Créer un nouveau magasin</a>
</body>
</html>
